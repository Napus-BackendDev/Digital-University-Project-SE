version: '3.9'

services:
  # Frontend Vue.js Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uniform-frontend
    ports:
      - "80:80"  # HTTP
      - "443:443"  # HTTPS
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - uniform-network
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf

  # Backend Node.js Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: uniform-backend
    ports:
      - "8081:8081"  # Backend API port
    restart: unless-stopped
    depends_on:
      - db
      - redis
    networks:
      - uniform-network
    environment:
      - NODE_ENV=production
      - PORT=8081
      - MONGODB=mongodb://leng2002:20122002@db:27017/equestionaire?authSource=admin
      - BASE_SERVER_URL=https://uniform.mfu.ac.th
      - FRONTEND_URL=https://uniform.mfu.ac.th
    env_file:
      - ./backend/.env

  # MongoDB Database
  db:
    image: mongo:7.0
    container_name: uniform-db
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=leng2002
      - MONGO_INITDB_ROOT_PASSWORD=20122002
    networks:
      - uniform-network

  # Redis Cache
  redis:
    image: redis:7.0-alpine
    container_name: uniform-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - uniform-network

volumes:
  mongodb-data:

networks:
  uniform-network:
    driver: bridge