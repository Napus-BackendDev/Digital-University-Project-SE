services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: uniform-backend
    depends_on:
      - db
      - redis
    expose:
      - "8081:8081"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB=mongodb://${MONGO_USERNAME:-change-me}:${MONGO_PASSWORD:-change-me}@db:27017/${MONGODB_DB:-equestionaire}?authSource=admin
      - MONGODB_DB=${MONGODB_DB:-equestionaire}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped
    networks:
      - uniform-network

  db:
    image: mongo:7.0
    container_name: uniform-db
    restart: unless-stopped
    volumes:
      - uniform-db-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-change-me}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-change-me}
    networks:
      - uniform-network

  redis:
    image: redis:7.0-alpine
    container_name: uniform-redis
    restart: unless-stopped
    networks:
      - uniform-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uniform-frontend
    depends_on:
      - backend
    # Expose Nginx proxy publicly (defaults to 8010 on host, can override using FRONTEND_PORT env var)
    ports:
      - "${FRONTEND_PORT:-8010}:80"
    restart: unless-stopped
    networks:
      - uniform-network

volumes:
  uniform-db-data:
    name: uniform-db-data

networks:
  uniform-network:
    name: uniform-network
    driver: bridge
